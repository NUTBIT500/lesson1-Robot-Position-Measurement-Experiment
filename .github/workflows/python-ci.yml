name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run experiment
        run: python experiment.py

      - name: Check output files
        run: |
          python -c "from pathlib import Path; p = Path('outputs'); assert all((p / f).is_file() for f in ('results.json', 'experiment.log', 'position_errors.png'))"
